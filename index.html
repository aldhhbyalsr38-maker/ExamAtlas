<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07060d">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<title>ExamAtlas</title>
<meta name="description" content="Practice questions with solutions, official exam sources and job boards, in 30 languages.">
<style>
:root{
  --bg:#07060d; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --text:#f3efe6; --mute:#a59fb8; --gold:#e8c26a; --gold2:#b8902f; --vio:#8b5cf6; --ok:#5ee0a0;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);background:var(--bg);
  font-family:"Noto Sans Arabic","Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  line-height:1.65;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.28),transparent 60%),
    radial-gradient(700px 500px at 0% 20%,rgba(232,194,106,.12),transparent 60%),
    radial-gradient(800px 600px at 50% 120%,rgba(91,33,182,.25),transparent 60%);
}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--text)}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1305;font-weight:900}
select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:.92rem;max-width:160px;cursor:pointer}
select option{background:#14102a;color:#fff}

nav.tabs{
  position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-bottom:6px;
  background:linear-gradient(var(--bg) 70%,transparent);scrollbar-width:none
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{
  flex:none;text-decoration:none;color:var(--mute);padding:10px 18px;border-radius:14px;font-weight:700;font-size:.95rem;
  border:1px solid transparent;transition:.2s;white-space:nowrap
}
nav.tabs a:hover{color:var(--text)}
nav.tabs a.on{color:#1a1305;background:linear-gradient(135deg,var(--gold),var(--gold2))}

.hero{text-align:center;padding:30px 0 18px}
.hero h1{font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.2;font-weight:900;
  background:linear-gradient(120deg,#fff 10%,var(--gold) 50%,#c9b3ff 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);margin:12px auto 0;font-size:clamp(.98rem,2.6vw,1.12rem);max-width:640px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:26px}
.fcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;transition:.2s;backdrop-filter:blur(8px)}
.fcard:hover{transform:translateY(-4px);border-color:var(--gold);background:rgba(232,194,106,.06)}
.fcard .ic{font-size:2.2rem}
.fcard b{display:block;font-size:1.2rem;margin-top:8px}
.fcard span{display:block;color:var(--mute);font-size:.93rem;margin-top:4px}

h2.sec{font-size:1.2rem;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1305;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1305;border-color:transparent}
.pill{min-width:46px;padding:9px 12px;text-align:center}
.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:14px;outline:none}
.search:focus{border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer;color:inherit;font:inherit;transition:.2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);background:rgba(232,194,106,.07);outline:none}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.card .f{font-size:2.1rem;line-height:1.1}
.card .nm{margin-top:6px;font-weight:700;font-size:.92rem}

.qbox{display:grid;gap:12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.q .top{display:flex;gap:12px;align-items:flex-start}
.q .no{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--gold);font-weight:800;font-size:.9rem}
.q .tx{font-size:1.05rem;font-weight:600;flex:1}
.q .tx.en{direction:ltr;text-align:left}
.q.star{border-color:rgba(232,194,106,.45);background:linear-gradient(160deg,rgba(232,194,106,.08),var(--card))}
.show{margin-top:12px;background:none;border:1px dashed var(--line);color:var(--gold);border-radius:12px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
.show:hover{border-color:var(--gold)}
.ans{margin-top:12px;border-radius:14px;padding:12px 14px;background:rgba(94,224,160,.07);border:1px solid rgba(94,224,160,.25)}
.ans b{color:var(--ok)}
.ans .st{color:var(--mute);margin-top:4px;font-size:.96rem}
.ans .en{direction:ltr;text-align:left}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.badge{display:inline-block;font-size:.72rem;font-weight:800;color:#1a1305;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:2px 9px;border-radius:99px;margin-inline-start:8px;vertical-align:middle}

.list{display:grid;gap:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.item b{display:block;font-size:1.02rem}
.item small{color:var(--mute);display:block;margin-top:2px}
.go{flex:none;text-decoration:none;color:#1a1305;font-weight:800;font-size:.9rem;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:10px 16px;border-radius:12px;white-space:nowrap}
.go:hover{filter:brightness(1.1)}
.sub{color:var(--mute);margin:-6px 0 14px}
.note{margin-top:26px;font-size:.84rem;color:var(--mute);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.empty{color:var(--mute);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:16px}
.ad-slot{margin:30px 0 0}
footer{margin-top:46px;text-align:center;color:var(--mute);font-size:.82rem}
[hidden]{display:none!important}
@media (max-width:520px){.item{flex-direction:column;align-items:stretch}.go{text-align:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#/"><span class="logo">E</span><span>ExamAtlas</span></a>
    <select id="lang" aria-label="Language"></select>
  </header>
  <nav class="tabs" id="nav"></nav>
  <main id="app"></main>
  <div class="note" id="t-note"></div>
  <!-- ADS: after launch + 1 month, place the AdSense unit inside this div -->
  <div class="ad-slot" id="ad-slot"></div>
  <footer>ExamAtlas · <span id="t-foot"></span></footer>
</div>
<script>
/* ================== DATA (edit monthly) ================== */

const m = (qa,qe,a,sa,se,e,imp)=>({q:[qa,qe],a,s:[sa,se],e,imp:!!imp});
const ar = (q,a,s,imp)=>({q,a,s,imp:!!imp,lang:"ar"});
const en = (q,a,sa,se,imp)=>({q,a,s:[sa,se],imp:!!imp,lang:"en"});

const QUESTIONS = {
math:{
1:[m("احسب: 5 + 3","Calculate: 5 + 3","8","نجمع 5 و3 فيصبح الناتج 8.","Add 5 and 3 to get 8.","5+3",1),
   m("احسب: 10 − 4","Calculate: 10 − 4","6","نطرح 4 من 10 فيبقى 6.","Subtract 4 from 10 to get 6.","10-4",1),
   m("ما العدد الذي يأتي بعد 19؟","What number comes after 19?","20","العدد التالي لـ19 هو 20.","The next number after 19 is 20.","19+1"),
   m("احسب: 2 + 2 + 2","Calculate: 2 + 2 + 2","6","2 + 2 = 4 ثم 4 + 2 = 6.","2 + 2 = 4, then 4 + 2 = 6.","2+2+2")],
2:[m("احسب: 23 + 19","Calculate: 23 + 19","42","20 + 10 = 30 و3 + 9 = 12، فالمجموع 42.","20 + 10 = 30 and 3 + 9 = 12, so the total is 42.","23+19",1),
   m("احسب: 50 − 27","Calculate: 50 − 27","23","50 − 27 = 23.","50 − 27 = 23.","50-27",1),
   m("احسب: 4 × 3","Calculate: 4 × 3","12","4 × 3 تعني 4 + 4 + 4 = 12.","4 × 3 means 4 + 4 + 4 = 12.","4*3"),
   m("احسب: 18 ÷ 2","Calculate: 18 ÷ 2","9","نقسم 18 إلى مجموعتين متساويتين، في كل منهما 9.","Split 18 into 2 equal groups of 9.","18/2")],
3:[m("احسب: 6 × 7","Calculate: 6 × 7","42","جدول الضرب: 6 × 7 = 42.","Times table: 6 × 7 = 42.","6*7",1),
   m("احسب: 56 ÷ 8","Calculate: 56 ÷ 8","7","لأن 8 × 7 = 56.","Because 8 × 7 = 56.","56/8",1),
   m("احسب: 345 + 278","Calculate: 345 + 278","623","5+8=13 (نكتب 3 ونحمل 1)، 4+7+1=12 (نكتب 2 ونحمل 1)، 3+2+1=6، فالناتج 623.","5+8=13 (write 3, carry 1), 4+7+1=12 (write 2, carry 1), 3+2+1=6, so 623.","345+278"),
   m("احسب: 1000 − 456","Calculate: 1000 − 456","544","1000 − 456 = 544.","1000 − 456 = 544.","1000-456")],
4:[m("احسب: 12 × 15","Calculate: 12 × 15","180","12 × 10 = 120 و12 × 5 = 60، والمجموع 180.","12 × 10 = 120 and 12 × 5 = 60, total 180.","12*15",1),
   m("احسب: 144 ÷ 12","Calculate: 144 ÷ 12","12","لأن 12 × 12 = 144.","Because 12 × 12 = 144.","144/12"),
   m("مستطيل طوله 8 سم وعرضه 5 سم. ما محيطه؟","A rectangle is 8 cm long and 5 cm wide. What is its perimeter?","26","المحيط = 2 × (8 + 5) = 26 سم.","Perimeter = 2 × (8 + 5) = 26 cm.","2*(8+5)",1),
   m("ما ثلاثة أرباع العدد 20؟","What is three quarters of 20?","15","20 ÷ 4 = 5 ثم 5 × 3 = 15.","20 ÷ 4 = 5, then 5 × 3 = 15.","20/4*3")],
5:[m("احسب: 2.5 + 3.75","Calculate: 2.5 + 3.75","6.25","نكتب 2.50 + 3.75 = 6.25.","Write 2.50 + 3.75 = 6.25.","2.5+3.75",1),
   m("احسب: ½ + ⅓","Calculate: ½ + ⅓","5/6","نوحّد المقامات: 3/6 + 2/6 = 5/6.","Common denominator: 3/6 + 2/6 = 5/6.","1/2+1/3",1),
   m("مثلث قاعدته 10 سم وارتفاعه 6 سم. ما مساحته؟","A triangle has base 10 cm and height 6 cm. What is its area?","30","المساحة = ½ × 10 × 6 = 30 سم².","Area = ½ × 10 × 6 = 30 cm².","0.5*10*6"),
   m("ما 15% من العدد 200؟","What is 15% of 200?","30","200 × 15 ÷ 100 = 30.","200 × 15 ÷ 100 = 30.","200*15/100")],
6:[m("احسب: ¾ ÷ ⅜","Calculate: ¾ ÷ ⅜","2","نقلب الكسر الثاني ونضرب: ¾ × 8/3 = 2.","Flip the second fraction and multiply: ¾ × 8/3 = 2.","(3/4)/(3/8)",1),
   m("بسّط النسبة 12 : 18","Simplify the ratio 12 : 18","2:3","نقسم الطرفين على 6 فنحصل على 2 : 3.","Divide both by 6 to get 2 : 3.",null,1),

7:[m("احسب: −7 + 12","Calculate: −7 + 12","5","12 − 7 = 5 لأن الأكبر موجب.","12 − 7 = 5 since the larger number is positive.","-7+12",1),
   m("حل المعادلة: 3س − 5 = 16","Solve: 3x − 5 = 16","7","3س = 21 فـ س = 7.","3x = 21, so x = 7.","(16+5)/3",1),

9:[m("حلّل: س² − 9","Factor: x² − 9","(س−3)(س+3)","فرق مربعين: س² − 3² = (س−3)(س+3).","Difference of squares: x² − 3² = (x−3)(x+3).",null,1),

   m("نقطة المنتصف بين (2,4) و(8,10)؟","Midpoint of (2,4) and (8,10)?","(5,7)","((2+8)/2 , (4+10)/2) = (5,7).","((2+8)/2 , (4+10)/2) = (5,7).",null),
   m("فُكّ: (س + 3)²","Expand: (x + 3)²","س² + 6س + 9","(أ+ب)² = أ² + 2أب + ب².","(a+b)² = a² + 2ab + b².",null)],
10:[m("حل المعادلة: 2س² − 8 = 0","Solve: 2x² − 8 = 0","س = 2 أو س = −2","س² = 4 فـ س = ±2.","x² = 4, so x = ±2.",null,1),
    m("ما قيمة جا 30°؟","What is sin 30°?","1/2","من الزوايا الخاصة: جا 30° = 1/2.","Special angle: sin 30° = 1/2.","0.5",1),
    m("المتتالية الحسابية 3، 7، 11، … ما حدّها العاشر؟","Arithmetic sequence 3, 7, 11, … What is the 10th term?","39","الحد = 3 + 9 × 4 = 39.","Term = 3 + 9 × 4 = 39.","3+9*4"),
    m("احسب: لو₁₀ 1000","Calculate: log₁₀ 1000","3","لأن 10³ = 1000.","Because 10³ = 1000.","Math.log10(1000)")],
11:[m("اشتق: س³","Differentiate: x³","3س²","قاعدة القوة: ن س^(ن−1) فتصبح 3س².","Power rule: n·x^(n−1) gives 3x².",null,1),
    m("إذا كان جاθ = 3/5 وθ حادة، فما جتاθ؟","If sin θ = 3/5 and θ is acute, what is cos θ?","4/5","جتا²θ = 1 − 9/25 = 16/25 فـ جتاθ = 4/5.","cos²θ = 1 − 9/25 = 16/25, so cos θ = 4/5.","Math.sqrt(1-(3/5)**2)",1),
    m("مجموع أول 5 حدود من المتتالية الهندسية 2، 4، 8، …","Sum of the first 5 terms of the geometric sequence 2, 4, 8, …","62","2 + 4 + 8 + 16 + 32 = 62.","2 + 4 + 8 + 16 + 32 = 62.","2*(2**5-1)"),
    m("حل المعادلة: 2^س = 32","Solve: 2^x = 32","5","لأن 2⁵ = 32.","Because 2⁵ = 32.","Math.log2(32)")],
12:[m("إذا كان ق(س) = س² + 3س فما ق′(2)؟","If f(x) = x² + 3x, what is f′(2)?","7","ق′(س) = 2س + 3 فـ ق′(2) = 7.","f′(x) = 2x + 3, so f′(2) = 7.","2*2+3",1),

    m("احسب: نهـا (س² − 4) ÷ (س − 2) عندما س → 2","Calculate: lim (x² − 4) ÷ (x − 2) as x → 2","4","(س−2)(س+2) ÷ (س−2) = س + 2 → 4.","(x−2)(x+2) ÷ (x−2) = x + 2 → 4.","2+2")]
},

 note_j:"نحن لا نوظّف ولا نضمن أي وظيفة. تحقق من أي إعلان، ولا تدفع مالاً مقابل التقديم لوظيفة.",
 no_q:"لا توجد أسئلة لهذا الصف بعد.",back:"رجوع"},
en:{hero_t:"Practise, find a job, reach official sources",hero_s:"Solved questions for grades 1–12, job boards and official links for every country, all in one place.",home:"Home",nav_q:"Questions",nav_j:"Jobs",nav_s:"Official sources",
 f_q:"Questions & solutions",f_q_d:"Pick a subject and grade and practise with solved questions without leaving the site.",
 f_j:"Jobs",f_j_d:"Local, remote and freelance job boards for your country.",
 f_s:"Official sources",f_s_d:"Links to official ministry and exam-board sites for each country.",
 subject:"Subject",grade:"Grade",g:"Grade",math:"Mathematics",arabic:"Arabic",english:"English",
 qs:"Questions",imp:"Most important questions with solutions",show:"Show solution",hide:"Hide solution",ans:"Answer",sol:"Explanation",
 papers:"Past papers by year",count:"questions",
 j_title:"Jobs",j_sub:"Choose your country to find suitable job boards.",j_local:"Job boards in your country",j_remote:"Remote jobs",j_free:"Freelance",j_pick:"Choose a country",j_none:"We haven't added local boards for this country yet, but the remote and freelance boards below are open to everyone.",
 open:"Open",s_title:"Official sources",s_sub:"Choose your country to reach official ministry and exam-board sites.",

 note_j:"We do not hire and cannot guarantee any job. Verify every listing and never pay money to apply for a job.",
 no_q:"No questions for this grade yet.",back:"Back"}
};
const tr = k => (N[lang] && N[lang][k] != null) ? N[lang][k] : N.en[k];

/* ================== LOGIC ================== */
const $ = id => document.getElementById(id);
let lang = "ar";
const SUBJECTS = ["math","arabic","english"];

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pick(x){ return Array.isArray(x) ? (lang==="ar" ? x[0] : x[1]) : x; }
function isEnItem(it){ return it.lang==="en" || (Array.isArray(it.q) && lang!=="ar"); }

function pickLang(){
  try{ const s = localStorage.getItem("ea_lang"); if(s && T[s]) return s; }catch(e){}
  const n = (navigator.language||"en").slice(0,2).toLowerCase();
  return T[n] ? n : "en";
}
function langName(code){ try{ return new Intl.DisplayNames([code],{type:"language"}).of(code); }catch(e){ return code; } }
function countryName(code){ try{ return new Intl.DisplayNames([lang],{type:"region"}).of(code); }catch(e){ return code; } }
function fillLangs(){
  const sel = $("lang");
  sel.innerHTML = Object.keys(T).map(c=>`<option value="${c}">${langName(c)}</option>`).join("");
  sel.value = lang;
  sel.onchange = () => { lang = sel.value; try{localStorage.setItem("ea_lang",lang);}catch(e){} route(); };
}

/* ---- router ---- */
function parse(){
  const h = (location.hash||"#/").replace(/^#\/?/,"");
  const p = h.split("/").filter(Boolean);
  return {page:p[0]||"home", a:p[1], b:p[2]};
}
function go(path){ location.hash = "#/" + path; }

function drawNav(page){
  const items = [["home","",tr("home")],["questions","questions",tr("nav_q")],["jobs","jobs",tr("nav_j")],["sources","sources",tr("nav_s")]];
  $("nav").innerHTML = items.map(([k,p,l])=>`<a href="#/${p}" class="${page===k?'on':''}">${l}</a>`).join("");
}

function route(){
  const t = T[lang], r = parse();
  document.documentElement.lang = lang;
  document.documentElement.dir = t.d;
  document.title = "ExamAtlas";
  drawNav(r.page);
  $("t-foot").textContent = t.foot + ": " + UPDATED;
  let note = t.note;
  if(r.page==="questions") note = tr("note_q");
  if(r.page==="jobs") note = tr("note_j");
  $("t-note").textContent = note;
  if(r.page==="questions") pageQuestions(r);
  else if(r.page==="jobs") pageJobs(r);
  else if(r.page==="sources") pageSources(r);
  else pageHome();
  window.scrollTo({top:0});
}

/* ---- pages ---- */
function pageHome(){
  const t = T[lang];
  $("app").innerHTML = `
  <section class="hero"><h1>${esc(tr("hero_t"))}</h1><p>${esc(tr("hero_s"))}</p></section>
  <div class="feat">
    <a class="fcard" href="#/questions"><div class="ic">📝</div><b>${esc(tr("f_q"))}</b><span>${esc(tr("f_q_d"))}</span></a>
    <a class="fcard" href="#/jobs"><div class="ic">💼</div><b>${esc(tr("f_j"))}</b><span>${esc(tr("f_j_d"))}</span></a>
    <a class="fcard" href="#/sources"><div class="ic">🏛️</div><b>${esc(tr("f_s"))}</b><span>${esc(tr("f_s_d"))}</span></a>
  </div>`;
}

function dcls(s,en){ return en ? "en" : (/[؀-ۿ]/.test(s) ? "" : "ltr"); }
function qCard(it, i, star){
  const text = pick(it.q), en = isEnItem(it);
  const sol = pick(it.s);
  const solEn = Array.isArray(it.s) && lang!=="ar";
  const ansBlock = `<div class="ans"><div><b>${esc(tr("ans"))}:</b> <bdi class="${dcls(it.a,en)}">${esc(it.a)}</bdi></div>
     <div class="st"><b>${esc(tr("sol"))}:</b> <bdi class="${dcls(sol,solEn)}">${esc(sol)}</bdi></div></div>`;
  if(star){
    return `<div class="q star"><div class="top"><div class="no">★</div><div class="tx ${en?'en':''}">${esc(text)}</div></div>${ansBlock}</div>`;
  }
  return `<div class="q"><div class="top"><div class="no">${i}</div><div class="tx ${en?'en':''}">${esc(text)}</div></div>
    <button class="show" data-open="0">${esc(tr("show"))}</button><div class="hold"></div>
    <template>${ansBlock}</template></div>`;
}

function pageQuestions(r){
  const subj = SUBJECTS.includes(r.a) ? r.a : "math";
  const grade = Math.min(12, Math.max(1, parseInt(r.b,10) || 1));
  const items = (QUESTIONS[subj] && QUESTIONS[subj][grade]) || [];
  const normal = items.filter(x=>!x.imp), star = items.filter(x=>x.imp);
  const years = (PAPERS[subj] && PAPERS[subj][grade]) || [];

  let html = `<h2 class="sec"><i>1</i>${esc(tr("subject"))}</h2><div class="chips">` +
    SUBJECTS.map(s=>`<button class="chip ${s===subj?'on':''}" data-s="${s}">${esc(tr(s))}</button>`).join("") + `</div>`;
  html += `<h2 class="sec"><i>2</i>${esc(tr("grade"))}</h2><div class="chips">` +
    Array.from({length:12},(_,k)=>k+1).map(g=>`<button class="chip pill ${g===grade?'on':''}" data-g="${g}">${g}</button>`).join("") + `</div>`;

  if(years.length){
    html += `<h2 class="sec"><i>★</i>${esc(tr("papers"))}</h2><div class="chips" id="years">` +
      years.map((y,k)=>`<button class="chip ${k===0?'on':''}" data-y="${k}">${y.year}</button>`).join("") + `</div><div class="qbox" id="ybox"></div>`;
  }

  html += `<h2 class="sec"><i>3</i>${esc(tr("qs"))} · ${esc(tr(subj))} · ${esc(tr("g"))} ${grade}</h2>`;
  if(!items.length) html += `<div class="empty">${esc(tr("no_q"))}</div>`;
  else{
    html += `<div class="qbox">${normal.map((it,i)=>qCard(it,i+1,false)).join("") || ""}</div>`;
    if(star.length) html += `<h2 class="sec"><i>★</i>${esc(tr("imp"))}</h2><div class="qbox">${star.map(it=>qCard(it,0,true)).join("")}</div>`;
  }
  $("app").innerHTML = html;

  $("app").querySelectorAll("[data-s]").forEach(b=> b.onclick = ()=> go(`questions/${b.dataset.s}/${grade}`));
  $("app").querySelectorAll("[data-g]").forEach(b=> b.onclick = ()=> go(`questions/${subj}/${b.dataset.g}`));
  $("app").querySelectorAll(".show").forEach(b=> b.onclick = ()=>{
    const card = b.closest(".q"), hold = card.querySelector(".hold");
    if(b.dataset.open==="0"){ hold.innerHTML = card.querySelector("template").innerHTML; b.dataset.open="1"; b.textContent = tr("hide"); }
    else{ hold.innerHTML = ""; b.dataset.open="0"; b.textContent = tr("show"); }
  });
  if(years.length){
    const showYear = k => {
      $("ybox").innerHTML = years[k].items.map((it,i)=>qCard(it,i+1,false)).join("");
      $("ybox").querySelectorAll(".show").forEach(b=> b.onclick = ()=>{
        const card=b.closest(".q"), hold=card.querySelector(".hold");
        if(b.dataset.open==="0"){hold.innerHTML=card.querySelector("template").innerHTML;b.dataset.open="1";b.textContent=tr("hide");}
        else{hold.innerHTML="";b.dataset.open="0";b.textContent=tr("show");}
      });
    };
    $("years").querySelectorAll("[data-y]").forEach(b=> b.onclick = ()=>{
      $("years").querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); b.classList.add("on"); showYear(+b.dataset.y);
    });
    showYear(0);
  }
}

function enName(c){ try{ return new Intl.DisplayNames(["en"],{type:"region"}).of(c).toLowerCase(); }catch(e){ return c.toLowerCase(); } }
function countryGrid(list, selected, base){
  const q = ($("q") && $("q").value || "").trim().toLowerCase();
  const items = list.map(c=>({c,n:countryName(c)})).filter(x=>!q||x.n.toLowerCase().includes(q)||enName(x.c).includes(q)||x.c.toLowerCase()===q).sort((a,b)=>a.n.localeCompare(b.n,lang));
  return items.map(x=>`<button class="card ${x.c===selected?'sel':''}" data-c="${x.c}"><div class="f">${COUNTRIES[x.c]?COUNTRIES[x.c].f:'🌍'}</div><div class="nm">${esc(x.n)}</div></button>`).join("") || `<div class="empty">—</div>`;
}
function flagOf(c){ return COUNTRIES[c] ? COUNTRIES[c].f : "🌍"; }

function pageSources(r){
  const list = Object.keys(COUNTRIES);
  const sel = COUNTRIES[r.a] ? r.a : null;
  let html = `<h2 class="sec"><i>1</i>${esc(tr("s_title"))}</h2><p class="sub">${esc(tr("s_sub"))}</p>
    <input class="search" id="q" type="search" autocomplete="off" placeholder="${esc(T[lang].q)}">
    <div class="grid" id="grid">${countryGrid(list, sel)}</div>`;
  if(sel){
    html += `<h2 class="sec"><i>2</i>${flagOf(sel)} ${esc(countryName(sel))}</h2><div class="list">` +
      COUNTRIES[sel].res.map(x=>`<div class="item"><div><b>${esc(x.n)}</b><small>${esc(countryName(sel))}</small></div>
        <a class="go" href="${x.u}" target="_blank" rel="noopener noreferrer">${esc(tr("open"))} ↗</a></div>`).join("") + `</div>`;
  }
  $("app").innerHTML = html;
  const wire = () => $("grid").querySelectorAll("[data-c]").forEach(b=> b.onclick = ()=> go("sources/"+b.dataset.c));
  wire();
  $("q").oninput = () => { $("grid").innerHTML = countryGrid(list, sel); wire(); };
}

function jobList(arr){
  return `<div class="list">` + arr.map(x=>`<div class="item"><div><b>${esc(x.n)}</b><small>${esc(x.d||"")}</small></div>
    <a class="go" href="${x.u}" target="_blank" rel="noopener noreferrer">${esc(tr("open"))} ↗</a></div>`).join("") + `</div>`;
}
function pageJobs(r){
  const list = Object.keys(COUNTRIES);
  const sel = COUNTRIES[r.a] ? r.a : null;
  let html = `<h2 class="sec"><i>1</i>${esc(tr("j_title"))}</h2><p class="sub">${esc(tr("j_sub"))}</p>
    <input class="search" id="q" type="search" autocomplete="off" placeholder="${esc(T[lang].q)}">
    <div class="grid" id="grid">${countryGrid(list, sel)}</div>`;
  if(sel){
    const local = (JOBS[sel] && JOBS[sel].local) || [];
    html += `<h2 class="sec"><i>2</i>${flagOf(sel)} ${esc(tr("j_local"))}</h2>` + (local.length ? jobList(local) : `<div class="empty">${esc(tr("j_none"))}</div>`);
  }
  html += `<h2 class="sec"><i>🌍</i>${esc(tr("j_remote"))}</h2>${jobList(JOBS.global.remote)}`;
  html += `<h2 class="sec"><i>✍️</i>${esc(tr("j_free"))}</h2>${jobList(JOBS.global.freelance)}`;
  $("app").innerHTML = html;
  const wire = () => $("grid").querySelectorAll("[data-c]").forEach(b=> b.onclick = ()=> go("jobs/"+b.dataset.c));
  wire();
  $("q").oninput = () => { $("grid").innerHTML = countryGrid(list, sel); wire(); };
}

window.addEventListener("hashchange", route);
lang = pickLang(); fillLangs(); route();

/* Offline support: cache the site shell after the first online visit. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("Offline support could not be registered:", err);
    });
  });
}


</script>
</body>
</html>
